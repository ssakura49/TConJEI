name: Java Mod CI

on:
  push:
    branches: [ "main" ]  # 触发分支
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 GitHub 提供的 Ubuntu 环境

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'  # Forge/Fabric 通常需要 JDK 17
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew  # 确保 Gradle Wrapper 可执行

      - name: Build with Gradle
        run: ./gradlew build  # 执行构建（生成模组 JAR 文件）

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: mod-artifact
          path: build/libs/*.jar  # 上传生成的 JAR 文件
